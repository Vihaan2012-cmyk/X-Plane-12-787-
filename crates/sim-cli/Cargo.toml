[package]
name = "b789-sim-cli"
description = "Offline runner: stand-in truth, the tablet screen in a desktop window, scenarios, replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "sim_cli"
path = "src/lib.rs"

[[bin]]
name = "sim-cli"
path = "src/main.rs"

[features]
default = []
electrical = ["dep:b789-sys-electrical"]
aircraft = ["electrical", "dep:b789-sys-ccs"]

[dependencies]
b789-render.workspace = true
b789-tablet.workspace = true
b789-sys-electrical = { workspace = true, optional = true }
b789-sys-ccs = { workspace = true, optional = true }
toml = "0.8.23"

[lints]
workspace = true
