value = 360.0
unit = "Hz"
approx = false
cite = "facts_elec_gen.verified.md:25"

[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e10"
t_s = 76.0
signal = "elec.gcb.l1.closed"
op = "true"
approx = false
cite = "facts_elec_gen.verified.md:82"

[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e11"
t_s = 76.0
signal = "elec.gcb.l2.closed"
op = "true"
approx = false
cite = "facts_elec_gen.verified.md:82"

[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e12"
t_s = 76.0
signal = "elec.bus.L1_235.source"
op = "eq"
value = "L1_VFSG"
