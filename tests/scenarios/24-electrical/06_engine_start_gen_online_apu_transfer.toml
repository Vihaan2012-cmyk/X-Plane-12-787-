[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e18"
t_s = 141.0
signal = "elec.bus.R1_235.energized"
op = "true"
approx = false
cite = "facts_elec_dist.verified.md:44"

[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e19"
t_s = 141.0
signal = "elec.bus.R2_235.energized"
op = "true"
approx = false
cite = "facts_elec_dist.verified.md:44"

[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e20"
t_s = 141.0
signal = "elec.bus.R1_235.source"
