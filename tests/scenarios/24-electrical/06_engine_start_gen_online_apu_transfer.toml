signal = "elec.gec1.l1.closed"
op = "false"
approx = false
cite = "facts_elec_gen.verified.md:95"

[[expect]]
id = "06_engine_start_gen_online_apu_transfer.e15"
t_s = 70.0
signal = "elec.gec3.l1.closed"
op = "true"
approx = false
