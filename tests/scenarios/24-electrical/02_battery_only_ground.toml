[scenario]
id = "02_battery_only_ground"
title = "Battery-only on ground: FCOM load list"
system = "24-electrical"
aircraft = "787-9"
engines = "trent1000"
tick_hz = 1000
summary = "On-Ground Battery Only mode: captain side items listed; no cabin and no AC-fed loads."

[initial]
airplane_state = "cold_dark"
on_ground = true
battery_switch = "ON"
apu_battery_connected = true
ext_pwr_fwd_l = "unplugged"
ext_pwr_fwd_r = "unplugged"
ext_pwr_aft = "unplugged"
gen_ctrl_switches = "ON"
oat_c = 15.0

[[step]]
t_s = 0.0
actor = "sim"
action = "advance"
target = "clock_s"
value = 1200.0

[[expect]]
id = "02_battery_only_ground.e01"
t_s = 10.0
signal = "elec.load.captain_inboard_du"
op = "true"
approx = false
cite = "elec_conditions.verified.md:46"

