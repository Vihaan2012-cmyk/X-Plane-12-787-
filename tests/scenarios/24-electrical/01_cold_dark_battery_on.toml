[scenario]
id = "01_cold_dark_battery_on"
title = "Cold and dark, main battery ON, only APU-start loads powered"
system = "24-electrical"
aircraft = "787-9"
engines = "trent1000"
tick_hz = 1000
summary = "Single press of BATTERY on a cold airplane; only battery-only ground mode loads and APU start capability available."

[initial]
airplane_state = "cold_dark"
on_ground = true
battery_switch = "OFF"
apu_battery_connected = true
ext_pwr_fwd_l = "unplugged"
ext_pwr_fwd_r = "unplugged"
ext_pwr_aft = "unplugged"
gen_ctrl_switches = "ON"
oat_c = 15.0

[[step]]
t_s = 0.0
actor = "crew"
action = "press"
target = "BATTERY"
value = "ON"

[[step]]
t_s = 60.0
actor = "sim"
action = "advance"
target = "clock_s"
value = 60.0

[[expect]]
id = "01_cold_dark_battery_on.e01"
t_s = 0.05
signal = "elec.hbb_main.voltage"
op = "within"
value = 29.5
tol = 5.5
unit = "V"
approx = false
cite = "elec2_r5_batteries_backup.md:61"

[[expect]]
id = "01_cold_dark_battery_on.e02"
t_s = 1.0
signal = "elec.mbr.closed"
op = "true"
approx = false
cite = "elec2_r5_batteries_backup.md:38"

[[expect]]
id = "01_cold_dark_battery_on.e03"
t_s = 1.0
signal = "elec.mode"
op = "eq"
value = "on_ground_battery_only"
approx = false
cite = "elec_conditions.verified.md:46"

[[expect]]
id = "01_cold_dark_battery_on.e04"
t_s = 1.0
signal = "elec.bus.captain_instr.energized"
op = "true"
approx = false
cite = "elec2_r5_batteries_backup.md:68"

