[scenario]
id = "08_total_ac_loss_rat_backup_bus"
title = "Loss of all AC in flight, RAT auto-deploy, 28 V standby bus loss, backup bus items"
system = "24-electrical"
aircraft = "787-9"
engines = "trent1000"
tick_hz = 1000
summary = "Total loss of AC: battery bridges instrument buses, BPCUs request RAT after 15 s, RAT feeds backup bus and center TRUs at up to 10 kVA."

[initial]
airplane_state = "cruise"
on_ground = false
battery_switch = "ON"
apu_battery_connected = true
ext_pwr_fwd_l = "unplugged"
ext_pwr_fwd_r = "unplugged"
ext_pwr_aft = "unplugged"
gen_ctrl_switches = "ON"
oat_c = 15.0
engines_running = [true, true]
apu_running = false
alt_ft = 37000.0

[[step]]
t_s = 10.0
actor = "fault"
action = "all_engines_flameout"
target = "ALL"

[[step]]
t_s = 10.0
actor = "fault"
action = "gen_loss"
target = "ALL_VFSG"

[[step]]
t_s = 12.0
actor = "sim"
action = "advance"
target = "clock_s"
value = 60.0

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e01"
t_s = 10.1
signal = "elec.bus.L1_235.energized"
op = "false"
approx = true
cite = "none"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e02"
t_s = 10.1
signal = "elec.bus.R2_235.energized"
op = "false"
approx = true
cite = "none"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e03"
t_s = 10.1
signal = "elec.bus.c1_tru.energized"
op = "false"
approx = false
cite = "elec2_r8_timing_loads.md:28"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e04"
t_s = 10.1
signal = "elec.bus.c2_tru.energized"
op = "false"
approx = false
cite = "elec2_r8_timing_loads.md:28"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e05"
t_s = 10.1
signal = "elec.mode"
op = "eq"
value = "in_air_battery_only"
approx = false
cite = "elec_conditions.verified.md:97"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e06"
t_s = 10.2
signal = "elec.bus.captain_instr.source"
op = "eq"
value = "main_battery"
approx = false
cite = "elec2_r5_batteries_backup.md:44"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e07"
t_s = 10.2
signal = "elec.bus.captain_instr.interrupt_ms"
op = "approx"
value = 30.0
tol = 15.0
unit = "ms"
approx = false
cite = "elec2_r5_batteries_backup.md:45"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e08"
t_s = 10.2
signal = "elec.cit.closed"
op = "true"
approx = false
cite = "elec2_r5_batteries_backup.md:70"

[[expect]]
id = "08_total_ac_loss_rat_backup_bus.e09"
t_s = 10.2
signal = "elec.standby_buses.paralleled_ms"
