[scenario]
id = "42_02_external_power_starts_right_ccr"
title = "Battery then forward external power: right CCR starts when the main DC buses are powered"
system = "42-ccs"
aircraft = "787-9"
engines = "trent1000"
tick_hz = 1000
summary = "Left CCR starts on battery; external power ON powers the main DC buses and the right CCR does its own full PBIT."

[initial]
airplane_state = "cold_dark"
on_ground = true
battery_switch = "OFF"
ext_pwr_fwd_l = "unplugged"
ext_pwr_fwd_r = "unplugged"
ext_pwr_aft = "unplugged"
gen_ctrl_switches = "ON"
oat_c = 15.0

[[step]]
t_s = 0.0
actor = "crew"
action = "press"
target = "BATTERY"
value = "ON"

[[step]]
t_s = 1.0
actor = "ground"
action = "connect"
target = "EXT_PWR_FWD_L"
value = { v_ll = 115.0, hz = 400.0, kva = 90.0 }

[[step]]
t_s = 1.0
actor = "ground"
action = "connect"
target = "EXT_PWR_FWD_R"
value = { v_ll = 115.0, hz = 400.0, kva = 90.0 }

[[step]]
t_s = 200.0
actor = "crew"
action = "press"
target = "EXT_PWR_FWD_L"

[[step]]
t_s = 201.0
actor = "crew"
action = "press"
target = "EXT_PWR_FWD_R"

[[step]]
t_s = 420.0
actor = "sim"
action = "advance"
target = "clock_s"
value = 420.0

[[expect]]
id = "42_02.e01"
t_s = 190.0
signal = "ccs.ccr.r.state"
op = "eq"
value = "off"
approx = false
cite = "ata42.txt right CCR starts when the BPCU enables the main DC loads"

[[expect]]
id = "42_02.e02"
t_s = 215.0
signal = "ccs.ccr.r.state"
op = "eq"
value = "booting"
approx = false
cite = "ata42.txt right CCR starts when the BPCU enables the main DC loads"

[[expect]]
id = "42_02.e03"
t_s = 410.0
signal = "ccs.ccr.r.state"
op = "eq"
value = "operational"
approx = false
cite = "ata42.txt total start-up up to 6 minutes"

[[expect]]
id = "42_02.e04"
t_s = 410.0
signal = "ccs.app.electrical_power_distribution.available"
op = "true"
approx = false
cite = "TAT_B787_ATA42 p60 hosted applications"
