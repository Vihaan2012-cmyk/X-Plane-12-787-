[scenario]
id = "42_03_crew_alerting_needs_the_ccs"
title = "Electrical alerts reach the crew only through CCS crew alerting once the left CCR is up"
system = "42-ccs"
aircraft = "787-9"
engines = "trent1000"
tick_hz = 1000
summary = "Battery ON: until the left CCR finishes its PBIT no crew alerting function runs; afterwards BPCU data arrives over the CDN and is valid."

[initial]
airplane_state = "cold_dark"
on_ground = true
battery_switch = "OFF"
ext_pwr_fwd_l = "unplugged"
ext_pwr_fwd_r = "unplugged"
ext_pwr_aft = "unplugged"
gen_ctrl_switches = "ON"
oat_c = 15.0

[[step]]
t_s = 0.0
actor = "crew"
action = "press"
target = "BATTERY"
value = "ON"

[[step]]
t_s = 200.0
actor = "sim"
action = "advance"
target = "clock_s"
value = 200.0

[[expect]]
id = "42_03.e01"
t_s = 60.0
signal = "ccs.cas.available"
op = "false"
approx = false
cite = "ata42.txt hosted functions not available until PBIT complete"

[[expect]]
id = "42_03.e02"
t_s = 195.0
signal = "ccs.cas.available"
op = "true"
approx = false
cite = "TAT_B787_ATA42 p60 crew alerting on L2 L3 L7"

[[expect]]
id = "42_03.e03"
t_s = 195.0
signal = "ccs.cas.elec_data_valid"
op = "true"
approx = false
cite = "ata42.txt P300/P400 connect to the ACS"
