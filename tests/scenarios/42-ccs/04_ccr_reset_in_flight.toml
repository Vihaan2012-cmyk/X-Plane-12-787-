[scenario]
id = "42_04_ccr_reset_in_flight"
title = "L CCR RESET in flight: inhibited restart, crew alerting carried by the right cabinet"
system = "42-ccs"
aircraft = "787-9"
engines = "trent1000"
tick_hz = 1000
summary = "QRH Loss of All Displays step 4: pushing L CCR RESET removes power without the 11 s save; the left CCR restarts inhibited in about a minute."

[initial]
airplane_state = "cruise"
on_ground = false
battery_switch = "ON"
apu_battery_connected = true
ext_pwr_fwd_l = "unplugged"
ext_pwr_fwd_r = "unplugged"
ext_pwr_aft = "unplugged"
gen_ctrl_switches = "ON"
oat_c = 15.0
engines_running = [true, true]
apu_running = false
alt_ft = 35000.0

[[step]]
t_s = 150.0
actor = "crew"
action = "press"
target = "CCR_RESET_L"

[[step]]
t_s = 260.0
actor = "sim"
action = "advance"
target = "clock_s"
value = 260.0

[[expect]]
id = "42_04.e01"
t_s = 140.0
signal = "ccs.ccr.l.state"
op = "eq"
value = "operational"
approx = false
cite = "ata42.txt inhibited start-up in the air"

[[expect]]
id = "42_04.e02"
t_s = 152.0
signal = "ccs.ccr.l.mode"
op = "eq"
value = "inhibited"
approx = false
cite = "ata42.txt CCR reset in the air starts inhibited"

[[expect]]
id = "42_04.e03"
t_s = 152.0
signal = "ccs.ccr.l.nvm_saves"
op = "eq"
value = 0
approx = false
cite = "ata42.txt reset skips the 11 s shutdown"

[[expect]]
id = "42_04.e04"
t_s = 160.0
signal = "ccs.cas.available"
op = "true"
approx = false
cite = "TAT_B787_ATA42 p60 crew alerting also on R2 R3"

[[expect]]
id = "42_04.e05"
t_s = 240.0
signal = "ccs.ccr.l.hosted_ready"
op = "true"
approx = false
cite = "qrh.txt Loss of All Displays wait 1 minute; ata42.txt 55-75 s"
